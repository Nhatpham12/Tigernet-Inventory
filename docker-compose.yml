# TIGERNET – chạy toàn bộ hệ thống bằng Docker (bản dev / demo).
#   Local:  cp deploy/.env.example .env  (sửa mật khẩu)  ->  docker compose up -d --build
#   EC2:    xem docs/DEPLOY_EC2.md (CI kéo image từ GHCR, không build trên máy chủ)
# Chỉ container "proxy" mở cổng ra ngoài (80/443). MySQL, backend, BFF chỉ nằm trong mạng nội bộ.

name: tigernet

x-restart: &restart
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  mysql:
    <<: *restart
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Đặt MYSQL_ROOT_PASSWORD trong .env}
      MYSQL_DATABASE: ${DB_NAME:-tigernet_dev}
      MYSQL_USER: ${DB_USERNAME:-tigernet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql-init:/docker-entrypoint-initdb.d:ro
      - ./docs/Database_Script_v7.sql:/schema/Database_Script_v7.sql:ro
      - ./database/tenant/V6__user_page_permissions.sql:/schema/V6__user_page_permissions.sql:ro
    healthcheck:
      # không cần mật khẩu: mysqladmin ping trả 0 khi server đang chạy, kể cả khi bị từ chối đăng nhập
      # (tránh để mật khẩu root trên dòng lệnh, ai xem được danh sách tiến trình cũng thấy)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  backend:
    <<: *restart
    image: ${REGISTRY:-tigernet}/tigernet-backend:${IMAGE_TAG:-local}
    build: ./backend
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-tigernet_dev}
      DB_USERNAME: ${DB_USERNAME:-tigernet}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY:?Đặt JWT_SIGNER_KEY (>= 64 ký tự) trong .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_OPTS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError}
    volumes:
      # đặt deploy/config/application.yaml (chép từ backend/company.example.yaml) để in thông tin doanh nghiệp
      - ./deploy/config:/app/config:ro

  bff:
    <<: *restart
    image: ${REGISTRY:-tigernet}/tigernet-bff:${IMAGE_TAG:-local}
    build: ./bff
    depends_on: [backend]
    environment:
      BACKEND_BASE_URL: http://backend:8080
      BFF_ALLOWED_ORIGINS: ${BFF_ALLOWED_ORIGINS:-https://${DOMAIN:-localhost},http://localhost:*}
      # cookie token có cờ Secure; chỉ đặt false khi truy cập bằng HTTP thuần qua tên miền/IP (chưa có chứng chỉ)
      BFF_COOKIE_SECURE: ${BFF_COOKIE_SECURE:-true}
      JAVA_OPTS: ${BFF_JAVA_OPTS:--XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError}

  web:
    <<: *restart
    image: ${REGISTRY:-tigernet}/tigernet-web:${IMAGE_TAG:-local}
    build: ./frontend

  proxy:
    <<: *restart
    image: nginx:1.27-alpine
    depends_on: [web, bff]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/nginx/ratelimit.conf:/etc/nginx/conf.d/00-ratelimit.conf:ro
      - ./deploy/nginx/common.inc:/etc/nginx/tigernet/common.inc:ro
      - ./deploy/nginx/http-only.conf.template:/etc/nginx/tigernet/http-only.conf.template:ro
      - ./deploy/nginx/https.conf.template:/etc/nginx/tigernet/https.conf.template:ro
      - ./deploy/nginx/40-tigernet-conf.sh:/docker-entrypoint.d/40-tigernet-conf.sh:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro

  # Gia hạn chứng chỉ Let's Encrypt mỗi 12 giờ (certbot chỉ gia hạn khi còn < 30 ngày).
  # Cấp lần đầu: deploy/scripts/init-letsencrypt.sh. Chạy kèm: docker compose --profile tls up -d
  certbot:
    <<: *restart
    image: certbot/certbot:v3.0.1
    profiles: ["tls"]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait; done"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

volumes:
  mysql-data:
  certbot-www:
  certbot-conf:
