# Phục vụ Flutter Web (SPA). TLS và /bff/ do container proxy phía trước lo.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    # index.html, service worker, bootstrap: không cache để bản mới có hiệu lực ngay sau deploy
    location ~* ^/(index\.html|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|wasm|css|png|jpg|svg|ico|ttf|otf|woff2?)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
