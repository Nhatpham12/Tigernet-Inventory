# Nạp vào http context (mount thành /etc/nginx/conf.d/00-ratelimit.conf).
server_tokens off;                                                  # không lộ phiên bản nginx
# Không còn giới hạn số request theo IP (bỏ 28/11/2026); chống dò mật khẩu nằm ở backend (khoá 5 lần sai/15 phút).

# HestiaCP (10.10.10.98) nhận HTTPS từ Internet rồi chuyển vào đây qua LAN. Chỉ tin X-Forwarded-For từ đúng máy đó
# để $remote_addr là IP thật của khách: log, fail2ban, nhật ký thao tác và khoá đăng nhập ở backend thấy IP thật
# (không gộp mọi người vào IP Hestia). Request từ IP khác giữ nguyên $remote_addr (không giả mạo được header).
set_real_ip_from 10.10.10.98;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
