# Nạp vào http context (mount thành /etc/nginx/conf.d/00-ratelimit.conf).
server_tokens off;                                                  # không lộ phiên bản nginx
# đăng nhập: 10 request/phút mỗi IP, burst 20 cho cả văn phòng dùng chung 1 IP đăng nhập đầu giờ.
# Chống dò mật khẩu chính là khoá tài khoản ở backend (5 lần sai/15 phút) + fail2ban.
limit_req_zone $binary_remote_addr zone=tn_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=tn_general:10m rate=20r/s; # API và web: 20 request/giây mỗi IP
limit_req_status 429;                                               # vượt giới hạn thì trả 429 Too Many Requests

# HestiaCP (10.10.10.98) nhận HTTPS từ Internet rồi chuyển vào đây qua LAN. Chỉ tin X-Forwarded-For từ đúng máy đó
# để $remote_addr là IP thật của khách: giới hạn đăng nhập tính theo từng người (không gộp cả văn phòng vào IP Hestia),
# log/fail2ban/nhật ký thao tác thấy IP thật. Request từ IP khác giữ nguyên $remote_addr (không giả mạo được header).
set_real_ip_from 10.10.10.98;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
