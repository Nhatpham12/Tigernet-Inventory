<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
<meta charset="UTF-8"/>
<title th:text="'Phiếu gửi hàng ' + ${code}">Phiếu gửi hàng</title>
<style>
  /* Bản gốc: FORM GỬI HÀNG Tigernet A5 (Word), A5 ngang, thân Times New Roman 16pt căn giữa */
  @page { size: 210mm 148mm; margin: 9mm 1.8mm 10mm 9.5mm; }
  body { font-family: 'Times New Roman', serif; font-size: 16pt; margin: 0; color: #000; }
  table { border-collapse: collapse; }
  .head { width: 100%; }
  .head td { vertical-align: top; padding: 0; font-size: 8pt; line-height: 1.3; font-family: 'Calibri', sans-serif; }
  .logo { text-align: right; padding-right: 60pt !important; }
  .logo img { height: 60pt; }
  .body { text-align: center; margin-top: 8pt; line-height: 1.15; padding: 0 6mm; }
  .body .gap { margin-top: 12pt; }
  .inc { font-size: 12pt; margin: 0 0 0 4pt; }
  .inc ul { margin: 4pt 0 0 0; padding: 0; list-style: none; }
  .inc li { font-style: italic; margin-bottom: 1pt; font-size: 11pt; }
  .footer { position: fixed; bottom: 0; left: 0; right: 0; text-align: center; font-size: 8pt; font-family: 'Calibri', sans-serif; }
</style>
</head>
<body>
<div th:each="p, st : ${pages}" th:style="${st.last} ? '' : 'page-break-after: always'">
  <table class="head">
    <tr>
      <td style="width:70%">
        <div style="font-weight:bold" th:text="${f.blank(company.name) ? '' : company.name + (f.blank(company.englishName) ? '' : ' – ' + company.englishName)}"></div>
        <div th:text="'MST/DN: ' + ${f.blank(company.taxCode) ? '…………………' : company.taxCode}"></div>
        <div th:text="'SĐT: ' + ${f.blank(company.phone) ? '…………………' : company.phone}"></div>
        <div th:text="'Email: ' + ${f.blank(company.email) ? '…………………' : company.email} + ' - Web: ' + ${f.blank(company.website) ? '…………………' : company.website}"></div>
        <div th:text="'Địa chỉ: ' + ${f.blank(company.address) ? '…………………' : company.address}"></div>
      </td>
      <td class="logo"><img th:if="${logo != null}" th:src="${logo}" alt=""/></td>
    </tr>
  </table>

  <div class="body">
    <div style="font-weight:bold">Người gửi:</div>
    <div><span th:text="${f.blank(company.representative) ? '' : company.representative}" style="font-weight:bold"></span><span th:if="${!f.blank(company.representative)}"> - </span>SĐT: <b th:text="${f.blank(company.phone) ? '…………………' : company.phone}"></b></div>
    <div style="font-weight:bold; margin-top:14pt">(HÀNG DỄ VỠ, XIN NHẸ TAY)</div>
    <div style="font-weight:bold" th:text="${p}">…../…..</div>
    <div class="gap" style="font-weight:bold">Người nhận:</div>
    <div><span th:text="${greet}"></span><b th:text="${f.blank(receiver.name) ? '……………………………' : receiver.name}"></b></div>
    <div><b>Địa chỉ:</b> <span th:text="${f.blank(receiver.address) ? '……………………………………' : receiver.address}"></span></div>
    <div>SĐT: <b th:text="${f.blank(receiver.phone) ? '…………………' : receiver.phone}"></b></div>
  </div>

  <div class="inc">
    <div style="font-weight:bold; margin-top:4pt">Bao gồm:</div>
    <ul>
      <li th:each="l : ${lines}"><span style="font-style:normal">-&#160;&#160;&#160;&#160;</span><span th:text="${l.name} + ' – SL: ' + ${f.qty(l.quantity)}"></span></li>
    </ul>
  </div>
</div>
<div class="footer" th:text="${company.slogan}"></div>
</body>
</html>
