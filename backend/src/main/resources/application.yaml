spring:
  config:
    import:
      - optional:file:.env[.properties]          # chạy từ thư mục backend
      - optional:file:backend/.env[.properties]  # chạy từ thư mục gốc TIGERNET
  application:
    name: backend
  datasource:
    # DB_NAME trong backend/.env: tigernet (mặc định) hoặc tigernet_dev cho nhánh dev
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tigernet}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        # giữ đúng tên bảng/cột như schema (MySQL trên Linux phân biệt hoa/thường)
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

jwt:
  signer-key: ${JWT_SIGNER_KEY}  # HS512 cần khóa >= 64 byte
  valid-duration: 3600           # giây, access token
  refresh-duration: 604800      # giây (7 ngày), refresh token

tigernet:
  rental:
    due-warning-days: 7     # cảnh báo/lọc phiếu thuê sắp đến hạn trong N ngày
    penalty-after-days: 10  # quá hạn từ N ngày trở lên mới tính phạt
