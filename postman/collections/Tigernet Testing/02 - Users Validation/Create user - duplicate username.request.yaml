$kind: http-request
description: Username UNIQUE (Database_Design_v7 §4.2) — tạo trùng username của user gốc phải bị từ chối.
url: '{{base_url}}{{users_path}}'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{base_username}}",
      "password": "Tiger@123",
      "fullName": "QA Dup Username",
      "email": "qa_dupuser_{{run_id}}@tigernet.test",
      "isActive": true,
      "roleId": {{role_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Không cho tạo trùng username", function () {
          pm.expect(pm.response.code).to.be.at.least(400);
      });
      pm.test("[Docs] Trả 409 Conflict hoặc 400", function () {
          pm.expect(pm.response.code).to.be.oneOf([409, 400]);
      });
    language: text/javascript
order: 2000
