$kind: http-request
description: GET user với id không tồn tại.
url: '{{base_url}}{{users_path}}/{{not_found_id}}'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Không trả dữ liệu cho id không tồn tại", function () {
          pm.expect(pm.response.code).to.be.at.least(400);
      });
      pm.test("[Docs] Trả 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 8000
