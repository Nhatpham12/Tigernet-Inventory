$kind: http-request
description: PUT user với id không tồn tại.
url: '{{base_url}}{{users_path}}/{{not_found_id}}'
method: PUT
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Ghost",
      "email": "ghost_{{run_id}}@tigernet.test",
      "isActive": true,
      "roleId": {{role_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Không cập nhật được user không tồn tại", function () {
          pm.expect(pm.response.code).to.be.at.least(400);
      });
      pm.test("[Docs] Trả 404 Not Found", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 10000
