$kind: http-request
description: Password_Hash NOT NULL — thiếu password phải bị từ chối.
url: '{{base_url}}{{users_path}}'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "qa_nopass_{{run_id}}",
      "fullName": "QA No Password",
      "email": "qa_nopass_{{run_id}}@tigernet.test",
      "isActive": true,
      "roleId": {{role_id}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Không cho tạo user thiếu password", function () {
          pm.expect(pm.response.code).to.be.at.least(400);
      });
      pm.test("[Docs] Trả 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 5000
