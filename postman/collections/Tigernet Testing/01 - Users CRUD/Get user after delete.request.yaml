$kind: http-request
description: |-
  Xác nhận user đã bị xoá. Code hiện tại xoá cứng nên mong đợi 404.
  BACKLOG QT-01 quy định DELETE là xoá mềm / khoá tài khoản: nếu trả 200 thì `isActive` phải là false.
url: '{{base_url}}{{users_path}}/{{user_id}}'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("[Docs] User hết hiệu lực: 404, hoặc 200 với isActive=false (xoá mềm)", function () {
          if (pm.response.code === 200) {
              const json = pm.response.json();
              const user = json.result ?? json.data ?? json;
              pm.expect(user.isActive).to.eql(false);
          } else {
              pm.expect(pm.response.code).to.eql(404);
          }
      });
    language: text/javascript
order: 7000
