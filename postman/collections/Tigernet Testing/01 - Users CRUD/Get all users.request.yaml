$kind: http-request
description: GET {{users_path}} — lấy toàn bộ người dùng; danh sách phải có user vừa tạo.
url: '{{base_url}}{{users_path}}'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", function () {
          pm.response.to.have.status(200);
      });

      const json = pm.response.json();
      const wrapped = json.result ?? json.data ?? json;
      const list = Array.isArray(wrapped) ? wrapped : wrapped.content;

      pm.test("Trả về mảng người dùng không rỗng", function () {
          pm.expect(list).to.be.an("array").that.is.not.empty;
      });

      pm.test("Danh sách có user vừa tạo", function () {
          const id = Number(pm.collectionVariables.get("user_id"));
          pm.expect(list.map(u => u.userId ?? u.id)).to.include(id);
      });

      pm.test("[Docs] Không phần tử nào lộ passwordHash", function () {
          list.forEach(u => pm.expect(u).to.not.have.property("passwordHash"));
      });
    language: text/javascript
order: 2000
