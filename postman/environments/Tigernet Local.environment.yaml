name: Tigernet Local
values:
  - key: base_url
    value: 'http://localhost:8080'
    enabled: true
    type: default
    description: Backend chạy local
  - key: auth_username
    value: user
    enabled: true
    type: default
    description: User mặc định của Spring Security (không cần nếu SecurityConfig đã permitAll)
  - key: auth_password
    value: ''
    enabled: true
    type: secret
    description: 'Mật khẩu trong log khởi động: "Using generated security password"'
  - key: admin_username
    value: ''
    enabled: true
    type: default
    description: 'Tigernet API Tests: user ADMIN để tự đăng nhập khi chạy lẻ 1 folder (bỏ trống nếu chạy cả collection)'
  - key: admin_password
    value: ''
    enabled: true
    type: secret
    description: Mật khẩu của admin_username
